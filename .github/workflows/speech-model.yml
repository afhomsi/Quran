name: Speech model

# Builds the offline Quran speech model the app downloads on first use and
# publishes it as a GitHub release. Runs when the export tooling changes, or
# by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    paths:
      - tool/asr/**
      - .github/workflows/speech-model.yml

permissions:
  contents: write

env:
  RELEASE_TAG: speech-model-v1

jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quran-tiny
            hf: tarteel-ai/whisper-tiny-ar-quran
          - name: quran-base
            hf: tarteel-ai/whisper-base-ar-quran
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          # openai-whisper still builds with pkg_resources.
          pip install "setuptools<70" wheel
          pip install --no-build-isolation openai-whisper==20240930
          pip install "numpy<2" transformers==4.44.2 \
            onnx==1.16.2 onnxruntime==1.19.2 sherpa-onnx
          curl -fsSL -o tool/asr/export_onnx.py \
            https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/master/scripts/whisper/export-onnx.py
      - name: Convert and export
        working-directory: tool/asr
        run: |
          python hf_to_openai.py ${{ matrix.hf }} ${{ matrix.name }}.pt
          python export.py ${{ matrix.name }}
          ls -l *.onnx *.txt
      - name: Transcribe Al-Fatiha
        working-directory: tool/asr
        run: |
          clips=""
          for a in 1 2 3 4 5 6 7; do
            curl -fsSL -o 00100$a.mp3 \
              https://everyayah.com/data/Alafasy_128kbps/00100$a.mp3 || continue
            ffmpeg -loglevel error -y -i 00100$a.mp3 -ar 16000 -ac 1 00100$a.wav
            clips="$clips 00100$a.wav"
          done
          python check.py ${{ matrix.name }} ${{ matrix.name }}-decoder.int8.onnx $clips
          python check.py ${{ matrix.name }} ${{ matrix.name }}-decoder.small.onnx $clips
      - name: Publish
        if: github.event_name != 'pull_request'
        working-directory: tool/asr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $RELEASE_TAG >/dev/null 2>&1 || \
            gh release create $RELEASE_TAG --target ${{ github.sha }} \
              --title "Offline speech model" \
              --notes "Quran-tuned Whisper models for offline recitation checking. Downloaded by the app on first use." || true
          gh release upload $RELEASE_TAG --clobber \
            ${{ matrix.name }}-encoder.int8.onnx \
            ${{ matrix.name }}-decoder.int8.onnx \
            ${{ matrix.name }}-decoder.small.onnx \
            ${{ matrix.name }}-tokens.txt

  vad:
    runs-on: ubuntu-latest
    needs: export
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Publish voice activity detector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          gh release upload $RELEASE_TAG --clobber silero_vad.onnx
