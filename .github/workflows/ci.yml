name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code; it cannot change the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: hifz-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      # A faster, smaller build for trying the app on a phone. It is still
      # signed with the debug key, so it is not for the Play Store.
      # The build number and date show in Settings and on the download page,
      # so an old install can be told apart from the newest one.
      - name: Build the release APK
        run: |
          build="${{ github.run_number }} · $(date -u '+%Y-%m-%d %H:%M')"
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define="APP_BUILD=$build"
          echo "$build" > build/app/outputs/flutter-apk/app-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hifz-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-build.txt

  # Puts the newest release APK behind one fixed link on GitHub Pages
  # (https://afhomsi.github.io/Quran/), refreshed on every push to main.
  # Needs Settings > Pages > Source set to "GitHub Actions" once.
  publish-apk:
    needs: build-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs can finish out of order. Publish only when this commit is still
      # the newest on main, so an older build never replaces a newer one.
      - id: newest
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on; the newer run publishes instead."
          fi
      - if: steps.newest.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: hifz-release-apk
          path: apk
      - name: Build the download page
        if: steps.newest.outputs.publish == 'true'
        run: |
          mkdir site
          number=${{ github.run_number }}
          build="$(cat apk/app-build.txt)"
          # A new file name for every build, so the phone never opens an
          # older download that has the same name. hifz.apk stays as a
          # fixed link to the newest one.
          cp apk/app-release.apk "site/hifz-$number.apk"
          mv apk/app-release.apk site/hifz.apk
          printf '{"build":"%s","apk":"hifz-%s.apk"}\n' "$build" "$number" > site/version.json
          sed -e "s/BUILD_INFO/$build/g" -e "s/BUILD_APK/hifz-$number.apk/g" \
            tool/apk_page/index.html > site/index.html
      - if: steps.newest.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.newest.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter build ios --debug --no-codesign

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter build web
